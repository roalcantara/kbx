<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kb — 16 Bookmark, detail</title>
<!-- State: Return on the YouTube bookmark: the thumbnail first, full width, then the description; the footer offers Open in Browser. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/prototype.css">
<script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="panel">
  <kb-header back-only></kb-header>
  <div class="content">
    <div class="detail">
      <div class="notes">
        <div class="media"><img src="https://img.youtube.com/vi/aqz-KE-bpKQ/maxresdefault.jpg" alt=""></div>
        <div class="quote">A YouTube bookmark, so its notes open with the video thumbnail.</div>
        <div class="source">Source: <code class="code-sm">bookmarks.yml</code></div>
      </div>
    </div>
  </div>
  <kb-footer context-type="bookmarks" favicon="https://icons.duckduckgo.com/ip3/www.youtube.com.ico" context="A conference talk" primary="Open in Browser"></kb-footer>
</div>
<script src="../shared/prototype.js"></script>
</body>
</html>
