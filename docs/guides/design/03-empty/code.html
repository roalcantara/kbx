<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"window-bg":"#24273A","selected-bg":"#363A4F","hover-bg":"#2F334A","accent-mauve":"#C6A0F6","accent-sky":"#8AADF4","accent-mint":"#A6DA95","accent-peach":"#F5A97F","text-primary":"#CAD3F5","text-muted":"#A5ADCB","text-faint":"#6E738D","toast-bg":"#181926","badge-bg":"#2E3248","background":"#181926"},"borderRadius":{"DEFAULT":"0.25rem","md":"0.375rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"fontFamily":{"headline-sm":["Inter"],"label-sm":["Inter"],"body-lg":["Inter"],"headline-md":["Inter"],"headline-lg":["Inter"],"body-sm":["Inter"],"label-xs":["Inter"],"body-md":["Inter"],"code-sm":["JetBrains Mono"],"label-md":["Inter"]}}}}</script></head><body class="bg-background font-body-md text-text-primary min-h-screen flex items-center justify-center p-4 selection:bg-accent-mauve/20 selection:text-accent-mauve"><main class="w-full max-w-[860px] mx-auto"><div class="flex flex-col w-full relative">
<!-- Window Container: Raycast / Alfred Style Command Palette (Catppuccin Macchiato) -->
<div class="w-full bg-window-bg rounded-[14px] shadow-[0_24px_64px_rgba(0,0,0,0.55),0_0_0_1px_rgba(202,211,245,0.08)] overflow-hidden flex flex-col relative select-none">
<!-- Top Search Bar Header (Seamless with window body) -->
<header class="h-[56px] px-6 bg-transparent flex items-center justify-between relative z-10 border-b border-text-faint/10">
<div class="flex items-center gap-3 flex-1 min-w-0">
<span class="material-symbols-outlined text-text-faint text-[20px] select-none">search</span>
<div class="flex items-center flex-1 min-w-0">
<input aria-label="Search entries" class="bg-transparent text-text-primary font-body-lg text-[15px] placeholder-text-faint focus:outline-none w-auto pr-1" placeholder="Type a command, cheat, or bookmark..." type="text" value="/unknown-cmd-xyz"/>
<span class="inline-block w-[1.5px] h-4 bg-accent-mauve animate-pulse ml-0.5"></span>
</div>
</div>
<!-- Right Accessory: Filter Pill -->
<div class="flex items-center gap-2 pl-3">
<div class="flex items-center gap-1 px-2.5 py-1 rounded-[6px] bg-badge-bg text-text-muted hover:text-text-primary transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[15px] text-text-faint group-hover:text-text-muted">tune</span>
<span class="font-label-sm text-[12px] font-medium">All Entries</span>
<span class="flex items-center gap-0.5 ml-1 bg-window-bg/80 px-1.5 py-0.5 rounded font-code-sm text-text-faint text-[10px]">
<span>⌘</span><span>P</span>
</span>
</div>
</div>
</header>
<!-- Main Results Stream: Single Continuous Flat List (No section category headers) -->
<div class="flex flex-col max-h-[460px] overflow-y-auto px-2 py-2 space-y-1 relative"><div class="flex flex-col items-center justify-center py-16 px-4 text-center my-auto"><div class="w-10 h-10 rounded-full bg-badge-bg flex items-center justify-center text-text-faint mb-3"><span class="material-symbols-outlined text-[20px]">search_off</span></div><h3 class="font-headline-sm text-[15px] font-medium text-text-primary mb-1">No matching entries found</h3><p class="font-body-sm text-[13px] text-text-muted max-w-[420px] mb-6">No commands, cheatsheets, or bookmarks match "<span class="font-code-sm text-accent-mauve">/unknown-cmd-xyz</span>".</p><div class="flex flex-wrap items-center justify-center gap-2 max-w-[520px]"><div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-[6px] bg-badge-bg text-text-muted hover:text-text-primary transition-colors cursor-pointer"><span class="font-label-xs text-[11px]">Press</span><span class="flex items-center gap-0.5 bg-window-bg px-1.5 py-0.5 rounded font-code-sm text-text-primary text-[10px] shadow-sm"><kbd>⌘</kbd><kbd>N</kbd></span><span class="font-label-xs text-[11px]">to create a new entry</span></div><div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-[6px] bg-badge-bg text-text-muted hover:text-text-primary transition-colors cursor-pointer"><span class="font-label-xs text-[11px]">Press</span><kbd class="bg-window-bg px-1.5 py-0.5 rounded font-code-sm text-text-primary text-[10px] shadow-sm">Esc</kbd><span class="font-label-xs text-[11px]">to clear search</span></div><div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-[6px] bg-badge-bg text-text-muted hover:text-text-primary transition-colors cursor-pointer"><span class="font-label-xs text-[11px]">Press</span><span class="flex items-center gap-0.5 bg-window-bg px-1.5 py-0.5 rounded font-code-sm text-text-primary text-[10px] shadow-sm"><kbd>⌘</kbd><kbd>P</kbd></span><span class="font-label-xs text-[11px]">to modify active filters</span></div></div></div></div>
<!-- Bottom Footer Status Bar (Seamless with window body) -->
<footer class="h-10 px-6 bg-transparent flex items-center justify-between font-label-xs text-[11px] text-text-faint border-t border-text-faint/10"><div class="flex items-center gap-2"><span class="inline-block w-1.5 h-1.5 rounded-full bg-accent-mint shadow-[0_0_6px_rgba(166,218,149,0.7)]"></span><span class="text-text-muted">Ready</span><span>•</span><span>0 results</span></div><div class="flex items-center gap-5"><div class="flex items-center gap-1.5"><span class="text-text-muted font-normal">Create Entry</span><div class="flex items-center gap-0.5"><kbd class="px-1.5 py-0.5 rounded-[4px] bg-badge-bg text-text-primary font-code-sm text-[11px] shadow-sm">⌘</kbd><kbd class="px-1.5 py-0.5 rounded-[4px] bg-badge-bg text-text-primary font-code-sm text-[11px] shadow-sm">N</kbd></div></div><div class="flex items-center gap-1.5"><span class="text-text-muted font-normal">Actions</span><div class="flex items-center gap-0.5"><kbd class="px-1.5 py-0.5 rounded-[4px] bg-badge-bg text-text-primary font-code-sm text-[11px] shadow-sm">⌘</kbd><kbd class="px-1.5 py-0.5 rounded-[4px] bg-badge-bg text-text-primary font-code-sm text-[11px] shadow-sm">K</kbd></div></div></div></footer>
<!-- High Contrast Toast Feedback (Bottom Right floating) -->
</div>
</div></main></body></html>
