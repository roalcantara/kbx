<!doctype html>
<html lang="en">
<head>

<title>kb — 13 Rebuild, stopped</title>

<link rel="stylesheet" href="../shared/tokens.css">

  <kb-header back-only></kb-header>

      <span class="body-sm faint">Press <kb-keys keys="⌘ R"></kb-keys> to try again.</span>

</div>
