<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kb — 17 Notice</title>
<!-- State: 01, then ⌘↵ on "All pods": its command is copied, and a success notice says so above the footer, bottom-right; it hides after 5 s or on ×. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/prototype.css">
<script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="panel">
  <kb-header></kb-header>
  <div class="content">
    <div class="list">
      <kb-row type="bookmarks" title="A conference talk" desc="A YouTube bookmark, so its notes open with the video thumbnail." tags="video,talks" favicon="https://icons.duckduckgo.com/ip3/www.youtube.com.ico"></kb-row>
      <kb-row type="notes" title="A note without notes"></kb-row>
      <kb-row type="commands" title="All pods" tags="kube" selected></kb-row>
      <kb-row type="snippets" title="An entry of an unknown type" tags="mixed-case"></kb-row>
      <kb-row type="notes" title="Café ☕ notes"></kb-row>
      <kb-row type="bookmarks" title="Example docs" desc="Uses the long spelling of the description field." tags="docs" links="3" favicon="https://icons.duckduckgo.com/ip3/example.com.ico"></kb-row>
      <kb-row type="cheats" title="Interactive rebase" tags="git"></kb-row>
      <kb-row type="notes" title="List notes"></kb-row>
      <kb-row type="commands" title="Run with the explicit cmd field"></kb-row>
      <kb-row type="tasks" title="Write the report"></kb-row>
      <kb-row type="commands" title="docker ps -a" desc="List every container, stopped ones too." tags="docker,containers"></kb-row>
      <kb-row type="tasks" title="port-engine" tags="rust,kb"></kb-row>
    </div>
    <div class="notice"><span class="glyph"><i data-lucide="circle-check"></i></span><span class="text body-md">Copied to Clipboard</span><span class="close"><i data-lucide="x"></i></span></div>
  </div>
  <kb-footer status="ready" count="12" primary="Show Details"></kb-footer>
</div>
<script src="../shared/prototype.js"></script>
</body>
</html>
