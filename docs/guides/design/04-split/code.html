<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kb — 04 Split</title>
<!-- State: the list with the split pane (→): "Interactive rebase" selected; rows show titles alone; the metadata card stays under the notes. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/prototype.css">
<script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="panel">
  <kb-header></kb-header>
  <div class="content">
    <div class="split-list">
      <kb-row type="snippets" title="An entry of an unknown type" tags="mixed-case" compact></kb-row>
      <kb-row type="notes" title="Café ☕ notes" compact></kb-row>
      <kb-row type="bookmarks" title="Example docs" desc="Uses the long spelling of the description field." tags="docs" links="3" favicon="https://icons.duckduckgo.com/ip3/example.com.ico" compact></kb-row>
      <kb-row type="cheats" title="Interactive rebase" tags="git" selected compact></kb-row>
      <kb-row type="notes" title="List notes" compact></kb-row>
      <kb-row type="commands" title="Run with the explicit cmd field" compact></kb-row>
      <kb-row type="tasks" title="Write the report" compact></kb-row>
      <kb-row type="commands" title="docker ps -a" desc="List every container, stopped ones too." tags="docker,containers" compact></kb-row>
      <kb-row type="tasks" title="port-engine" tags="rust,kb" compact></kb-row>
    </div>
    <div class="pane">
      <div style="flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:var(--space-md)">
        <div class="notes-body">
          <h2>Steps</h2>
          <ol><li>Pick the first commit</li><li>Squash the rest</li></ol>
          <table><tr><th>Key</th><th>Meaning</th></tr><tr><td>p</td><td>pick</td></tr><tr><td>s</td><td>squash</td></tr></table>
        </div>
        <div class="codeblock"><span class="k">const</span> answer: <span class="t">number</span> <span class="p">=</span> <span class="n">42</span></div>
        <div class="codeblock"><span class="p">{</span>
  <span class="f">"retries"</span><span class="p">:</span> <span class="n">3</span><span class="p">,</span>
  <span class="f">"hosts"</span><span class="p">: [</span><span class="s">"a"</span><span class="p">,</span> <span class="s">"b"</span><span class="p">]</span>
<span class="p">}</span></div>
      </div>
      <div class="card"><div class="meta"><span class="label">Type</span><span class="value"><span class="tag blue">Cheats</span></span></div><div class="meta"><span class="label">Tags</span><span class="value"><kb-tag name="git"></kb-tag></span></div><div class="meta"><span class="label">Source</span><span class="value"><i data-lucide="file"></i>cheats.yml</span></div></div>
    </div>
  </div>
  <kb-footer status="ready" count="12" primary="Show Details"></kb-footer>
</div>
<script src="../shared/prototype.js"></script>
</body>
</html>
