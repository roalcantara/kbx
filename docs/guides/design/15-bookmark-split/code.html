<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kb — 15 Bookmark, split</title>
<!-- State: a YouTube bookmark in the split pane: its favicon in the row, the thumbnail first in the pane, the metadata card under it. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/prototype.css">
<script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="panel">
  <kb-header></kb-header>
  <div class="content">
    <div class="split-list">
      <kb-row type="bookmarks" title="A conference talk" desc="A YouTube bookmark, so its notes open with the video thumbnail." tags="video,talks" favicon="https://icons.duckduckgo.com/ip3/www.youtube.com.ico" selected compact></kb-row>
      <kb-row type="notes" title="A note without notes" compact></kb-row>
      <kb-row type="commands" title="All pods" tags="kube" compact></kb-row>
      <kb-row type="snippets" title="An entry of an unknown type" tags="mixed-case" compact></kb-row>
      <kb-row type="notes" title="Café ☕ notes" compact></kb-row>
      <kb-row type="bookmarks" title="Example docs" desc="Uses the long spelling of the description field." tags="docs" links="3" favicon="https://icons.duckduckgo.com/ip3/example.com.ico" compact></kb-row>
      <kb-row type="cheats" title="Interactive rebase" tags="git" compact></kb-row>
      <kb-row type="notes" title="List notes" compact></kb-row>
      <kb-row type="commands" title="Run with the explicit cmd field" compact></kb-row>
      <kb-row type="tasks" title="Write the report" compact></kb-row>
      <kb-row type="commands" title="docker ps -a" desc="List every container, stopped ones too." tags="docker,containers" compact></kb-row>
      <kb-row type="tasks" title="port-engine" tags="rust,kb" compact></kb-row>
    </div>
    <div class="pane">
      <div style="flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:var(--space-md)">
        <div class="media"><img src="https://img.youtube.com/vi/aqz-KE-bpKQ/maxresdefault.jpg" alt=""></div>
        <div class="quote">A YouTube bookmark, so its notes open with the video thumbnail.</div>
      </div>
      <div class="card"><div class="meta"><span class="label">URL</span><span class="value link">https://www.youtube.com/watch?v=aqz-KE-bpKQ <i data-lucide="arrow-up-right"></i></span></div><div class="meta"><span class="label">Type</span><span class="value"><span class="tag purple">Bookmarks</span></span></div><div class="meta"><span class="label">Tags</span><span class="value"><kb-tag name="video"></kb-tag><kb-tag name="talks"></kb-tag></span></div><div class="meta"><span class="label">Source</span><span class="value"><i data-lucide="file"></i>bookmarks.yml</span></div></div>
    </div>
  </div>
  <kb-footer status="ready" count="12" primary="Show Details"></kb-footer>
</div>
<script src="../shared/prototype.js"></script>
</body>
</html>
