  "tools/bench/fixtures/",
  "target/",
  "tools/bench/ts/kb",
  "tools/bench/ts/node_modules/",
  "*.lock",
  "docs/guides/results/",
]

[default.extend-words]
# A status of the todo CLI (TODO.md): French for "in progress".
cours = "cours"
