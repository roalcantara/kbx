# The tag tools (docs/doctrine/tag-conventions.doctrine.md), included from the root mise.toml. The logic and its tests
# are in tags.ts; these are its entry points. They read kb's index and config, and write only in the knowledge folder.

["tags:test"]
description = "Test the tag tools"
run = "bun test tools/tags"

["tags:suggest"]
description = "Propose tag merges: writes docs/tags.proposed.toml in the knowledge folder, for review (the first run queries Wikidata for minutes)"
run = '''
#!/usr/bin/env bun
import { join } from 'node:path'
// mise runs an inline script from a temporary file, so the module is imported from the project root.
const { abbreviations, concepts, proposalsToml, propose, readIndex, readSemantic, stackOverflowSynonyms, tagsDir } = await import(`${process.cwd()}/tools/tags/tags.ts`)

const { uses, cooccur } = readIndex()
const dir = tagsDir()
const synonyms = await stackOverflowSynonyms('tmp/tags/so-synonyms.json')
const sources = {
  synonyms,
  abbreviations: await abbreviations('tmp/tags/abbreviations.json', synonyms),
  concepts: await concepts(Object.keys(uses), 'tmp/tags/wikidata-labels.json'),
  // One-off judgements (an LLM pass) the owner reviews like the rest, if present.
  semantic: readSemantic(join(dir, 'tags.semantic.toml')),
}
const proposals = propose(uses, cooccur, sources)
const merged = new Set(proposals.map((p) => p.alias))
const loose = Object.keys(uses).filter((t) => uses[t] === 1 && !merged.has(t)).sort()
const file = join(dir, 'tags.proposed.toml')
await Bun.write(file, proposalsToml(proposals, uses, loose))
const bySignal = Map.groupBy(proposals, (p) => p.signal)
console.log(`${Object.keys(uses).length} tags; ${proposals.length} proposals (${[...bySignal].map(([s, ps]) => `${s} ${ps.length}`).join(', ')}); ${loose.length} used once`)
console.log(`wrote ${file}: review it, save it as tags.toml, then run mise run tags:apply`)
'''

["tags:apply"]
description = "Apply docs/tags.toml to the knowledge folder's YAML: a diff by default, --write to rewrite"
usage = 'flag "--write" help="rewrite the files instead of printing the diff"'
run = '''
#!/usr/bin/env bun
import { $ } from 'bun'
import { join, relative } from 'node:path'
// mise runs an inline script from a temporary file, so the module is imported from the project root.
const { readAliases, rewrite, sourcesDir, tagsDir } = await import(`${process.cwd()}/tools/tags/tags.ts`)

const dir = sourcesDir()
const write = process.env.usage_write === 'true'
const status = await $`git -C ${dir} status --porcelain`.nothrow().quiet()
if (status.exitCode !== 0) throw new Error(`${dir} is not a git work tree: run git init and commit it first`)
if (write && status.stdout.toString().trim()) throw new Error(`${dir} has uncommitted changes: commit them first`)
const aliases = readAliases(join(tagsDir(), 'tags.toml'))
// The dry run writes its copies in kb's tmp/, never in the knowledge folder.
const scratch = join(process.cwd(), 'tmp/tags/dry-run')
await $`rm -rf ${scratch}`.quiet()
let changed = 0
for await (const path of new Bun.Glob('**/*.{yml,yaml}').scan({ cwd: dir, absolute: true })) {
  const text = await Bun.file(path).text()
  const next = rewrite(text, aliases)
  if (next === text) continue
  changed++
  if (write) {
    await Bun.write(path, next)
  } else {
    const copy = join(scratch, relative(dir, path))
    await Bun.write(copy, next)
    await $`git diff --no-index --color=always -- ${path} ${copy}`.nothrow()
  }
}
console.log(write
  ? `rewrote ${changed} files; review with git -C ${dir} diff, then commit`
  : `${changed} files would change; run mise run tags:apply --write to rewrite them`)
'''

["tags:check"]
description = "List the indexed tags that break the convention or are an alias in docs/tags.toml"
run = '''
#!/usr/bin/env bun
import { existsSync } from 'node:fs'
import { join } from 'node:path'
// mise runs an inline script from a temporary file, so the module is imported from the project root.
const { readAliases, readIndex, tagsDir, violations } = await import(`${process.cwd()}/tools/tags/tags.ts`)

const { uses } = readIndex()
const map = join(tagsDir(), 'tags.toml')
const aliases = existsSync(map) ? readAliases(map) : {}
const problems = Object.keys(uses).sort().flatMap((tag) => {
  const found = [...violations(tag), ...(aliases[tag] ? [`an alias of ${aliases[tag]}`] : [])]
  return found.length ? [`${tag} (${uses[tag]}): ${found.join('; ')}`] : []
})
console.log(problems.length ? problems.join('\n') : 'every tag follows the convention')
process.exit(problems.length ? 1 : 0)
'''

["tags:images"]
description = "Fill the tag-images folder from docs/tags.images.toml, Simple Icons and Lucide: a plan by default, --write to copy; writes a preview page"
usage = 'flag "--write" help="write the images instead of printing the plan"'
run = '''
#!/usr/bin/env bun
import * as simpleIcons from 'simple-icons@15.0.0'
import * as lucide from 'lucide-static@0.469.0'
import { copyFileSync, existsSync, mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs'
import { join } from 'node:path'
// mise runs an inline script from a temporary file, so the module is imported from the project root.
const { imageSource, readIndex, tagsDir } = await import(`${process.cwd()}/tools/tags/tags.ts`)

const home = process.env.HOME
const config = join(home, '.config/kb/config.toml')
const configured = existsSync(config) ? Bun.TOML.parse(readFileSync(config, 'utf8')).tag_images_path : undefined
const dir = (configured ?? '~/.config/kb/images').replace(/^~/, home)
mkdirSync(dir, { recursive: true })
const existing = new Set(readdirSync(dir).filter((f) => f.endsWith('.svg')).map((f) => f.slice(0, -4).toLowerCase()))
const mapFile = join(tagsDir(), 'tags.images.toml')
const map = existsSync(mapFile) ? Bun.TOML.parse(readFileSync(mapFile, 'utf8')) : {}

const brands = new Map(Object.values(simpleIcons).filter((i) => i?.slug).map((i) => [i.slug, i]))
// A logo keeps its brand colour (kb draws a coloured image as it is), unless the colour is too dark to read on kb's
// window: then it stays a shape, which kb draws in its muted text colour.
const { contrast } = await import(`${process.cwd()}/tools/design/color.ts`)
const window = JSON.parse(readFileSync('tools/design/palettes.json', 'utf8')).find((p) => p.chosen).roles.window
const logo = ({ svg, hex }) => (contrast(`#${hex}`, window) >= 3 ? svg.replace('<svg ', `<svg fill="#${hex}" `) : svg)
// Lucide exports PascalCase names; its icon names are kebab-case, digits split off (Gamepad2 → gamepad-2, Grid3x3 → grid-3x3).
const kebab = (s) => s.replace(/([a-z0-9])([A-Z])/g, '$1-$2').replace(/(?<!\d)([a-zA-Z])(\d)/g, '$1-$2').toLowerCase()
const icons = new Map(Object.entries(lucide).filter(([k, v]) => /^[A-Z]/.test(k) && typeof v === 'string').map(([k, v]) => [kebab(k), v]))
const library = { brands: new Set(brands.keys()), icons: new Set(icons.keys()) }

const { uses } = readIndex()
const tags = Object.keys(uses).sort((a, b) => uses[b] - uses[a] || a.localeCompare(b))
const write = process.env.usage_write === 'true'
const added = [], missing = [], errors = []
for (const tag of tags) {
  let source
  try { source = imageSource(tag, map, existing, library) } catch (e) { errors.push(e.message); continue }
  if (!source) { missing.push(`${tag} (${uses[tag]})`); continue }
  if (source.kind === 'keep' || source.kind === 'none') continue
  const target = join(dir, `${tag}.svg`)
  if (source.kind === 'file' && !existsSync(join(dir, source.name))) { errors.push(`${tag}: no ${source.name} in ${dir}`); continue }
  added.push(`${tag} ← ${source.kind}:${source.name}`)
  if (!write) continue
  if (source.kind === 'file') copyFileSync(join(dir, source.name), target)
  else writeFileSync(target, source.kind === 'lucide' ? icons.get(source.name) : logo(brands.get(source.name)))
}
if (errors.length) { console.error(errors.join('\n')); process.exit(1) }

// The preview draws each image as kb does: a mask in one colour, in a pill.
const shown = write ? tags.filter((t) => existsSync(join(dir, `${t}.svg`))) : tags.filter((t) => existing.has(t))
const cell = (t) => `<figure><span style="-webkit-mask-image:url('file://${join(dir, t)}.svg')"></span><figcaption>#${t}</figcaption></figure>`
mkdirSync('tmp/tags', { recursive: true })
writeFileSync('tmp/tags/images.html', `<!doctype html><meta charset="utf-8"><title>Tag images</title><style>
body{background:#0f1420;color:#c8d0e0;font:12px system-ui;display:flex;flex-wrap:wrap;gap:8px;padding:16px}
figure{margin:0;width:96px;text-align:center}figcaption{margin-top:4px;overflow:hidden;text-overflow:ellipsis}
span{display:block;margin:auto;width:16px;height:16px;padding:3px 8px;background:#9bb4ff;-webkit-mask-size:16px;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;outline:1px solid #2a3350;border-radius:10px}
</style>${shown.map(cell).join('')}`)

console.log(`${added.length} images ${write ? 'written' : 'to write (--write writes them)'}:\n  ${added.join('\n  ')}`)
console.log(`${missing.length} tags without an image (text pills; map them in ${mapFile}):\n  ${missing.join(', ')}`)
console.log(`preview: ${process.cwd()}/tmp/tags/images.html`)
'''
