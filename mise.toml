min_version = "2026.9.13"

[settings]
# mise.lock records every tool's download and checksum for the machines that run this repo: Apple silicon
# Macs and CI's Linux runners. Run `mise lock` after changing a tool: CI installs with --locked, and fails otherwise.
lockfile_platforms = ["linux-x64", "macos-arm64"]
# Rust comes from rust-toolchain.toml, the file rustup reads: one pin, its channel and components, for both.
idiomatic_version_file_enable_tools = ["rust"]

# Code graph health (tools/graph/README.md): mise doctor project.
[doctor.checks.graph_crg_installed]
description = "code-review-graph is installed and on PATH"
run = "command -v code-review-graph >/dev/null 2>&1"
hint = "Run `mise install`."
timeout = "1s"

[doctor.checks.graph_crg_version]
description = "code-review-graph matches the pinned version"
run = '''
  expected=$(grep -E '"pipx:code-review-graph"[[:space:]]*=[[:space:]]*"[^"]+"' mise.toml | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
  if [ -z "$expected" ]; then exit 0; fi
  actual=$(code-review-graph --version 2>/dev/null || true)
  printf '%s\n' "$actual" | grep -Eq "v?${expected//./\\.}([[:space:]]|$)"
'''
hint = "Align the installed CRG version with the one pinned in mise.toml."
timeout = "3s"

[doctor.checks.graph_crg_repo]
description = "CRG has initialized its repo graph directory"
run = "test -d .code-review-graph"
hint = "Run `mise run graph setup crg` to build the repository graph."
timeout = "1s"

[doctor.checks.graph_crg_mcp]
description = "CRG is wired in .mcp.json"
run = '''
  test -f .mcp.json && grep -q '"code-review-graph"' .mcp.json
'''
hint = "`.mcp.json` is committed: restore it with `git checkout -- .mcp.json`."
timeout = "1s"

[doctor.checks.graph_crg_gitignore]
description = "The repo ignores .code-review-graph"
run = "git check-ignore -q .code-review-graph"
hint = "Add `.code-review-graph/` to .gitignore."
timeout = "1s"

[doctor.checks.graph_gortex_installed]
description = "gortex is installed and on PATH"
run = "command -v gortex >/dev/null 2>&1"
hint = "Run `mise install`."
timeout = "1s"

[doctor.checks.graph_gortex_daemon]
description = "Gortex daemon is running"
run = "gortex daemon status >/dev/null 2>&1"
hint = "Run `mise run graph setup gortex` or `gortex daemon start --detach` to bring the daemon online."
timeout = "2s"

[doctor.checks.graph_gortex_repo]
description = "This repo is tracked by Gortex"
run = 'gortex repos 2>/dev/null | grep -Fq "$PWD"'
hint = "Run `mise run graph setup gortex` to track the repository."
timeout = "2s"

[doctor.checks.graph_graphify_installed]
description = "graphify is installed and on PATH"
run = "command -v graphify >/dev/null 2>&1"
hint = "Run `mise install`."
timeout = "1s"

[doctor.checks.graph_graphify_artifact]
description = "Graphify output exists for this repo"
run = "test -f graphify-out/graph.json"
hint = "Run `mise run graph setup graphify` (code-only, no LLM) or `mise run graph build graphify --force` (full semantic build)."
timeout = "1s"

[doctor.checks.graph_graphify_gitignore]
description = "The repo ignores graphify-out"
run = "git check-ignore -q graphify-out"
hint = "Add `graphify-out/` to .gitignore."
timeout = "1s"

[doctor.checks.graph_fnox_secrets]
description = "fnox resolves the secrets in .fnox.toml (Graphify's --force pass needs an LLM key)"
run = "fnox list -P default --sources >/dev/null 2>&1"
hint = "Run `mise install`; fnox reads password-store (`pass`): see .fnox.toml for the entries it expects."

[task_config]
includes = [
  "tools/design/tasks.toml", # the design kit (tools/design)
  "tools/graph/tasks.toml",  # the code graph tools (tools/graph/README.md)
  "tools/tags/tasks.toml",   # the tag tools (docs/doctrine/tag-conventions.doctrine.md)
]

[tools]
jactionlint = "2.1.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:jackchuka/mdschema" = "0.15.5"
ast-grep = "0.50.0"
bun = "1.4.3"
cargo-binstall = "1.25.3"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-machete" = "0.9.2"
# Packages kbx.app, so macOS only.
"cargo:cargo-packager" = { version = "0.11.8", os = ["macos"] }
"cargo:cargo-nextest" = "0.9.148"
"cargo:https://github.com/RayanBO/todo/" = "tag:v0.2.9"
dprint = "0.63.0"
hk = { version = "2.6.0", workflow = "release.yml" }
jq = "1.8.2"
ls-lint = "2.3.1"
"npm:jscpd" = "5.4.1"
pinact = "5.0.0"
"pipx:commit-check" = "2.18.3"
# Installs pipx tools from their locks in .mise/locks (mise needs uv >= 0.12.10 for that).
uv = "0.13.0"
# The interpreter the pipx tools run on: mise probes `python` on PATH before installing one (2026.10.7).
python = "3.13.16"
pkl = "0.32.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
# TOML linting against schemas (tombi.toml); taplo formats.
tombi = "1.10.0"
typos = "1.51.1"
zizmor = "1.30.1"
"npm:quick-commitlint" = { version = "0.1.2", allow_low_downloads = true }
node = "26.11.1"

# Code graphs for agents (tools/graph/README.md)
"github:zzet/gortex" = "0.64.8"
"pipx:code-review-graph" = "2.3.9"
"pipx:graphifyy" = "0.9.88"
# Secrets for Graphify's LLM pass (and GITHUB_TOKEN), resolved from password-store (.fnox.toml)
fnox = "1.39.0"

[tasks.setup]
description = "Install tools, fetch crates and the git hooks"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail

  mise install
  cargo fetch --locked
  {% if env.CI is defined %}
    echo "CI detected — skipping git hooks"
  {% else %}
    hk install --mise
  {% endif %}
'''

[tasks.gate]
description = "Run every quality gate, stopping at the first failure. --fast runs tests and clippy only."
usage = 'flag "--fast" help="nextest and clippy only, for inner loops"'
run = '''
  #!/usr/bin/env bash
  set -euo pipefail

  cargo nextest run --workspace --locked
  cargo test --doc --workspace --locked # nextest does not run doctests
  cargo clippy --workspace --all-targets --locked -- -D warnings
  if [ "${usage_fast:-false}" = "true" ]; then exit 0; fi
  cargo build --workspace --release --locked
  hk check --all
  cargo deny check
  RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
'''

# CI (.github/workflows/ci.yml) runs these on Linux; kbx itself compiles only on macOS (GPUI).
[tasks.ci]
description = "What CI checks: the gate on macOS; elsewhere ci:lint and ci:test, in parallel"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  if [ "$(uname -s)" = Darwin ]; then exec mise run gate; fi
  exec mise run ci:lint ::: ci:test
'''

[tasks."ci:lint"]
description = "hk's checks that need neither GPUI nor a branch name"
# cargo-check and clippy compile the app (GPUI, macOS only); branch reads a branch name, which a pull request's merge checkout has not.
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cargo fetch --locked # domain-purity resolves offline, as after `mise run setup`
  hk check --all --skip-step cargo-check --skip-step clippy --skip-step branch
'''

[tasks."ci:test"]
description = "The engine, which compiles anywhere: clippy, tests and doctests of kbx-domain; cargo deny"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cargo clippy -p kbx-domain --all-targets --locked -- -D warnings
  cargo nextest run -p kbx-domain --locked
  cargo test --doc -p kbx-domain --locked
  cargo deny check
'''

# Releases (docs/adr/0007-releases.md): semantic-release reads .releaserc.yml; CI runs these on push to main.
[tasks.release]
description = "semantic-release from the commits since the last tag; `-- --dry-run --no-ci` previews it locally"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  exec npx --yes \
    -p semantic-release@25.0.9 \
    -p @semantic-release/changelog@7.0.0 \
    -p @semantic-release/exec@7.1.0 \
    -p @semantic-release/git@11.0.1 \
    -p @semantic-release/github@12.0.10 \
    -p conventional-changelog-conventionalcommits@9.3.1 \
    semantic-release "$@"
'''

[tasks."release:version"]
description = "Set the workspace version in Cargo.toml and Cargo.lock, so kbx.app reports it"
usage = 'arg "<version>"'
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cargo fetch --locked # before the bump: the lockfile still matches, and the update below needs no network
  perl -0pi -e 's/(\[workspace\.package\]\n)version = "[^"]*"/${1}version = "$ENV{usage_version}"/' Cargo.toml
  grep -q "^version = \"${usage_version}\"$" Cargo.toml || { echo "no [workspace.package] version to set"; exit 1; }
  cargo update --workspace --offline
'''

[tasks."release:app"]
description = "Package kbx.app at a version and zip it as target/release-assets/kbx-<version>-macos-arm64.zip"
usage = 'arg "<version>"'
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  mise run release:version "$usage_version"
  mise run package
  out="target/release-assets/kbx-$usage_version-macos-arm64.zip"
  rm -rf target/release-assets && mkdir -p target/release-assets
  ditto -c -k --keepParent target/packager/kbx.app "$out" # ditto keeps the signature and bundle metadata
  echo "$out"
'''

[tasks.app]
description = "Build the panel in release mode and start it; press ⌥K to show it"
usage = 'flag "--trace" help="log the show and keystroke latencies to stderr"'
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cargo build --release --locked -p kbx-app
  if [ "${usage_trace:-false}" = "true" ]; then exec target/release/kbx --trace; fi
  exec target/release/kbx
'''

[tasks.show]
description = "Show the panel without the hotkey: build, then (re)start kbx in the background, which opens showing it"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  cargo build --release --locked -p kbx-app
  pkill -x kbx || true # a running kbx cannot be asked to show itself; a fresh one opens showing the panel
  while pgrep -x kbx >/dev/null; do sleep 0.2; done
  mkdir -p tmp
  nohup target/release/kbx >tmp/kbx.log 2>&1 &
  echo "kbx started (pid $!); its output goes to tmp/kbx.log"
'''

[tasks.size]
description = "Build the release binary and check it against tools/size/budget"
run = "cargo build --release --locked -p kbx-app && tools/size/size.sh"

[tasks.package]
description = "Build kbx.app (target/packager) and sign it ad hoc for this machine"
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  (cd crates/kbx-app && cargo packager --release --formats app)
  # Ad hoc: enough to run here. Distribution needs a Developer ID and notarization (README).
  codesign --force --sign - target/packager/kbx.app
  echo "target/packager/kbx.app"
'''

[tasks.install]
description = "Package kbx.app and install it in ~/Applications; start it from there or at login"
depends = ["package"]
run = '''
  #!/usr/bin/env bash
  set -euo pipefail
  mkdir -p ~/Applications
  pkill -x kbx || true
  rm -rf ~/Applications/kbx.app
  cp -R target/packager/kbx.app ~/Applications/
  echo "installed ~/Applications/kbx.app; open it, then press ⌥K"
'''

[tasks.outdated]
description = "Check for outdated dependencies"
usage = '''
  flag "--mise" help="ONLY Mise outdated check"
'''
run = '''
  #!/usr/bin/env bash
  set -euo pipefail

  if [ "${usage_mise:-true}" = "true" ]; then
    mise outdated --local --bump
  fi
'''

[tasks.bump]
description = "Bump outdated dependencies"
usage = '''
  flag "--mise" help="ONLY Mise outdated dependencies bump"
'''
run = '''
  #!/usr/bin/env bash
  set -euo pipefail

  if [ "${usage_mise:-true}" = "true" ]; then
    mise upgrade --local --bump
  fi
'''
