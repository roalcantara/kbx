ls:
  .dir: regex:^([a-z0-9-]+|\.agents|\.claude|\.github|\.config)$

  # Rust modules are snake_case; crate directories kebab-case.
  crates:
    .dir: kebab-case
  crates/*/src:
    .dir: snake_case
    .rs: snake_case
  crates/*/tests:
    .rs: snake_case
  crates/*/benches:
    .rs: snake_case

ignore:
  - .mise
  - .git
  - .vscode
  - target
  - tmp
  - crates/kbx-domain/tests/fixtures
  - .ls-lint.yml
  - .superpowers
  - .delta
  - .code-review-graph
  - graphify-out
  - .gortex
