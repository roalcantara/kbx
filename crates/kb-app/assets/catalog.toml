# What kb offers: its entry types, its actions, each screen's keys, the action panel's rows and the
# words it shows (spec D18). ~/.config/kb/config.toml overrides any key below by the same path, for
# example `[actions.copy] label = "Yank"`. Colours and sizes are not here: they are DESIGN.md's.
#
# Keys use GPUI's spelling: modifiers joined by `-` before the key (`cmd-shift-f`, `shift-cmd-enter`).
# A screen's keys are `enter`, `cmd-enter`, `shift-cmd-enter` and `escape`; their value is an action,
# or `entry.primary` / `entry.secondary` (the selected entry's actions, list and detail only).

# Entry types (D6): any other type in the sources is ignored by the app. The table key is the type as
# the sources write it. `tint` is a colour token of DESIGN.md; `hero` is media, command, snippet or task; a type without one shows none.
[types.bookmarks]
label = "Bookmarks"
icon = "bookmark"
tint = "blue"
hero = "media"
primary = "open"
secondary = "copy"

[types.cheats]
label = "Cheat Sheets"
icon = "book-open"
tint = "mauve"
hero = "snippet"
primary = "copy"

[types.commands]
label = "Commands"
icon = "square-terminal"
tint = "green"
hero = "command"
mono_title = true
primary = "copy"

[types.tasks]
label = "Tasks"
icon = "circle-check"
tint = "pink"
hero = "task"
primary = "copy"


[types.skills]
label = "Skills"
icon = "notebook-text"
tint = "yellow"
primary = "copy"
# Actions (D7, D9). `keys` binds the action everywhere in the panel.
[actions.details]
label = "Details"

[actions.open]
label = "Open"

[actions.copy]
label = "Copy"

[actions.resize]
label = "Resize"
keys = "cmd-shift-f"

[actions.copy-description]
label = "Description"

[actions.copy-notes]
label = "Notes"

[actions.copy-path]
label = "Path"
keys = "cmd-alt-c"

[actions.copy-location]
label = "Copy Location"
keys = "cmd-shift-l"

[actions.copy-error]
label = "Copy Error"
keys = "cmd-shift-e"

[actions.reveal]
label = "Reveal in Finder"
keys = "cmd-shift-r"

[actions.edit]
label = "Edit"
keys = "cmd-o"

[actions.refresh]
label = "Refresh"
keys = "cmd-r"


[actions.refresh-yaml]
label = "Refresh YAML"

[actions.refresh-skills]
label = "Refresh Skills"
[actions.configure]
label = "Configure"
keys = "cmd-shift-,"

[actions.actions]
label = "Actions"
keys = "cmd-k"

[actions.filter]
label = "Filter"
keys = "cmd-p"

[actions.stop]
label = "Stop"

[actions.back]
label = "Back"

[actions.retry]
label = "Retry"

[actions.toggle]
label = "Toggle"

[actions.only]
label = "Only"

[actions.clear-filters]
label = "Clear All"

[actions.open-link]
label = "Open"

[actions.copy-link]
label = "Copy"

# Screen keys (D8, D10, D15, D16): the ladder ↵ / ⌘↵ / ⇧⌘↵, and Esc while refreshing; the report and its detail.
[screens.list]
enter = "details"
cmd-enter = "entry.primary"
shift-cmd-enter = "entry.secondary"

[screens.detail]
enter = "entry.primary"
cmd-enter = "entry.secondary"

[screens.empty]
enter = "refresh"

[screens.no-index]
enter = "refresh"

[screens.filter]
enter = "toggle"
cmd-enter = "only"

[screens.links]
enter = "open-link"
cmd-enter = "copy-link"

[screens.refreshing]
escape = "stop"

[screens.report]
enter = "details"
cmd-enter = "edit"
shift-cmd-enter = "copy-location"

[screens.report-detail]
enter = "edit"
cmd-enter = "copy-location"
[screens.stopped]
enter = "retry"

[screens.failed]
enter = "retry"
cmd-enter = "configure"

# The action panel (D9): after the screen's keys, the root lists `root`, then Links… (with links) and
# More…; More… lists `more_copy` under `copy_section`, then `more_admin` under `admin_section`, with
# `refresh_more` after Refresh opening `more_refresh`, then `theme` opening the themes (~/.config/kb/themes).
[panel]
links = "Links…"
more = "More…"
refresh_more = "Refresh More…"
theme = "Theme…"
search = "Search"
copy_section = "Copy"
admin_section = "Administration"
types_section = "Types"
tags_section = "Tags"
root = ["resize"]
more_copy = ["copy-description", "copy-notes", "copy-path"]
more_admin = ["edit", "refresh", "configure"]
more_refresh = ["refresh-yaml", "refresh-skills"]
